# Checks that every package's copy of the community files is the master text kept here. A change to a master file fails this
# until the new text has reached every package, which is the order the change is made in. Nothing here costs anything on a
# public repository.
name: Copies
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-copies.mjs
